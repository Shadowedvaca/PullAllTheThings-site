name: Publish curated GitHub Release

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact production-verified commit
        required: true
        type: string
      release_tag:
        description: Exact production-verified tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: patt-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate production result and publish curated notes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out production-verified commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify tag target and main ancestry
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^prod-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --tags --no-force origin "$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main

      - name: Validate version, tag, and curated notes
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/validate_release.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Create or update matching GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes_path }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "Pull All The Things $RELEASE_VERSION" --notes-file "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Pull All The Things $RELEASE_VERSION" --notes-file "$RELEASE_NOTES"
          fi
