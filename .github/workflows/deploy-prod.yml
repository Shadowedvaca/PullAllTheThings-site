name: Deploy to Production

on:
  push:
    tags:
      - "prod-v*"

permissions: {}

concurrency:
  group: patt-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    name: Enforce Production readiness and exact test provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      release_tag: ${{ steps.release.outputs.tag }}
      release_version: ${{ steps.release.outputs.version }}
      test_run_id: ${{ steps.provenance.outputs.run_id }}
      test_run_url: ${{ steps.provenance.outputs.run_url }}

    steps:
      - name: Check out immutable production tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Enforce repository Production readiness
        run: python scripts/validate_production_readiness.py

      - name: Validate tag, main ancestry, and release contract
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          python scripts/validate_release.py --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
          sha="$(git rev-parse HEAD)"
          test "$sha" = "$GITHUB_SHA"
          test "$sha" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require successful test deployment for exact tag SHA
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-test.yml/runs" \
            -f branch=main -f event=push -f status=success -f per_page=100 | \
            python scripts/validate_test_provenance.py \
              --sha "$RELEASE_SHA" --github-output "$GITHUB_OUTPUT"
          run_url="$(grep '^run_url=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2-)"
          echo "Exact-SHA test evidence: $run_url" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy exact approved production tag
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    outputs:
      release_sha: ${{ needs.preflight.outputs.release_sha }}
      release_tag: ${{ needs.preflight.outputs.release_tag }}

    steps:
      - name: Check out preflight-verified commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 1

      - name: Configure strict environment-scoped SSH trust
        id: ssh
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deploy/configure-deployment-ssh.sh

      - name: Deploy exact tag commit via strict SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY_PATH: ${{ steps.ssh.outputs.private_key }}
          DEPLOY_SSH_KNOWN_HOSTS_PATH: ${{ steps.ssh.outputs.known_hosts }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.release_sha }}
          DEPLOY_TAG: ${{ needs.preflight.outputs.release_tag }}
          DEPLOY_VERSION: ${{ needs.preflight.outputs.release_version }}
          TEST_RUN_ID: ${{ needs.preflight.outputs.test_run_id }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$DEPLOY_TAG" | grep -Eq '^prod-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          printf '%s\n' "$DEPLOY_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          printf '%s\n' "$TEST_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          evidence_file="$RUNNER_TEMP/patt-production-deployment.txt"
          bash deploy/run-strict-ssh.sh \
            "set -eu; export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_TERMINAL_PROMPT=0; cd /opt/guild-portal; previous_sha=\$(if [ -s .deployment/active-sha ]; then cat .deployment/active-sha; else git rev-parse HEAD; fi); fetch_repository=\$(mktemp -d /tmp/patt-fetch.XXXXXX); trap 'rm -rf \$fetch_repository' EXIT; git -C \$fetch_repository init --bare; env -i PATH=/usr/bin:/bin HOME=/tmp GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_TERMINAL_PROMPT=0 git -C \$fetch_repository fetch --no-tags '$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git' '$DEPLOY_TAG:refs/tags/$DEPLOY_TAG'; git fetch --no-tags \$fetch_repository 'refs/tags/$DEPLOY_TAG:refs/tags/$DEPLOY_TAG'; rm -rf \$fetch_repository; trap - EXIT; test \"\$(git rev-list -n 1 '$DEPLOY_TAG')\" = '$DEPLOY_SHA'; git checkout --detach '$DEPLOY_TAG'; test \"\$(git rev-parse HEAD)\" = '$DEPLOY_SHA'; exec bash deploy/patt-remote-deploy.sh production '$DEPLOY_SHA' '$DEPLOY_VERSION' \"\$previous_sha\" '$DEPLOY_TAG' '$TEST_RUN_ID'" \
            | tee "$evidence_file"
          grep -Fqx \
            "PATT_DEPLOYMENT_COMPLETE environment=production version=$DEPLOY_VERSION commit=$DEPLOY_SHA" \
            "$evidence_file"

  publish:
    name: Publish verified production release
    needs: deploy
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      release_sha: ${{ needs.deploy.outputs.release_sha }}
      release_tag: ${{ needs.deploy.outputs.release_tag }}
