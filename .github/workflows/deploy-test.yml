name: Deploy to Test

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: patt-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved main commit to test.pullallthethings.com
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: test

    steps:
      - name: Check out immutable main commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate and record deployment identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/validate_release.py --github-output "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Configure strict environment-scoped SSH trust
        id: ssh
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deploy/configure-deployment-ssh.sh

      - name: Deploy exact main commit via strict SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY_PATH: ${{ steps.ssh.outputs.private_key }}
          DEPLOY_SSH_KNOWN_HOSTS_PATH: ${{ steps.ssh.outputs.known_hosts }}
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$DEPLOY_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          bundle_file="$RUNNER_TEMP/patt-deployment-$DEPLOY_SHA.bundle"
          remote_bundle="/tmp/patt-deployment-$DEPLOY_SHA.bundle"
          remote_admission="/tmp/patt-shared-host-deploy-$DEPLOY_SHA.sh"
          git bundle create "$bundle_file" HEAD
          git bundle verify "$bundle_file"
          bash deploy/run-strict-scp.sh "$bundle_file" "$remote_bundle"
          bash deploy/run-strict-scp.sh deploy/patt-shared-host-deploy.sh "$remote_admission"
          preparation_evidence="$RUNNER_TEMP/patt-test-preparation.txt"
          bash deploy/run-strict-ssh.sh \
            "bash '$remote_admission' prepare test '$DEPLOY_SHA' '$DEPLOY_VERSION'" \
            | tee "$preparation_evidence"
          grep -Fqx \
            "PATT_DEPLOYMENT_PREPARED environment=test version=$DEPLOY_VERSION commit=$DEPLOY_SHA" \
            "$preparation_evidence"
          deployment_evidence="$RUNNER_TEMP/patt-test-deployment.txt"
          bash deploy/run-strict-ssh.sh \
            "cd /opt/guild-portal && bash deploy/patt-shared-host-deploy.sh activate test '$DEPLOY_SHA' '$DEPLOY_VERSION'" \
            | tee "$deployment_evidence"
          grep -Fqx \
            "PATT_DEPLOYMENT_COMPLETE environment=test version=$DEPLOY_VERSION commit=$DEPLOY_SHA" \
            "$deployment_evidence"
