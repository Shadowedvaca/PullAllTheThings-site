name: Rehearsal bootstrap (temporary branch only)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Explicit bootstrap branch
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    name: Quarantine and establish rehearsal host identity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: rehearsal

    steps:
      - name: Check out exact bootstrap branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch }}

      - name: Report runner address and wait for clone SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "5.78.239.33"
          runner_ip="$(curl -fsS https://api.ipify.org)"
          printf 'PATT_REHEARSAL_RUNNER_IPV4=%s\n' "$runner_ip"

          key_file="$RUNNER_TEMP/patt-rehearsal-key"
          known_hosts="$RUNNER_TEMP/patt-rehearsal-known-hosts"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$key_file"
          trap 'shred -u "$key_file" 2>/dev/null || rm -f "$key_file"; rm -f "$known_hosts"' EXIT

          connected=false
          for attempt in $(seq 1 180); do
            if ssh-keyscan -T 3 -t ed25519 "$DEPLOY_HOST" > "$known_hosts" 2>/dev/null; then
              connected=true
              break
            fi
            sleep 5
          done
          test "$connected" = true

          ssh -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "root@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_HOST'" \
            < scripts/bootstrap_rehearsal_host.sh
