name: Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Explicit branch to deploy to development
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: patt-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact commit to dev.pullallthethings.com
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: development

    steps:
      - name: Resolve branch to an immutable commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Validate and record deployment identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_release.py --github-output "$GITHUB_OUTPUT"
          sha="$(git rev-parse HEAD)"
          printf '%s\n' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure strict environment-scoped SSH trust
        id: ssh
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deploy/configure-deployment-ssh.sh

      - name: Deploy exact commit via strict SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY_PATH: ${{ steps.ssh.outputs.private_key }}
          DEPLOY_SSH_KNOWN_HOSTS_PATH: ${{ steps.ssh.outputs.known_hosts }}
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_VERSION: ${{ steps.release.outputs.version }}
          DEPLOY_REF: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$DEPLOY_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          git check-ref-format --branch "$DEPLOY_REF" >/dev/null
          bundle_file="$RUNNER_TEMP/patt-deployment-$DEPLOY_SHA.bundle"
          remote_bundle="/tmp/patt-deployment-$DEPLOY_SHA.bundle"
          remote_admission="/tmp/patt-shared-host-deploy-$DEPLOY_SHA.sh"
          git bundle create "$bundle_file" HEAD
          git bundle verify "$bundle_file"
          bash deploy/run-strict-scp.sh "$bundle_file" "$remote_bundle"
          bash deploy/run-strict-scp.sh deploy/patt-shared-host-deploy.sh "$remote_admission"
          preparation_evidence="$RUNNER_TEMP/patt-development-preparation.txt"
          bash deploy/run-strict-ssh.sh \
            "bash '$remote_admission' prepare development '$DEPLOY_SHA' '$DEPLOY_VERSION'" \
            | tee "$preparation_evidence"
          grep -Fqx \
            "PATT_DEPLOYMENT_PREPARED environment=development version=$DEPLOY_VERSION commit=$DEPLOY_SHA" \
            "$preparation_evidence"
          deployment_evidence="$RUNNER_TEMP/patt-development-deployment.txt"
          bash deploy/run-strict-ssh.sh \
            "cd /opt/guild-portal && bash deploy/patt-shared-host-deploy.sh activate development '$DEPLOY_SHA' '$DEPLOY_VERSION'" \
            | tee "$deployment_evidence"
          grep -Fqx \
            "PATT_DEPLOYMENT_COMPLETE environment=development version=$DEPLOY_VERSION commit=$DEPLOY_SHA" \
            "$deployment_evidence"
