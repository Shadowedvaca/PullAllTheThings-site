name: Deploy to Dev

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Explicit branch to deploy to development
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: patt-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact commit to dev.pullallthethings.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development

    steps:
      - name: Resolve branch to an immutable commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Validate and record deployment identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_release.py --github-output "$GITHUB_OUTPUT"
          sha="$(git rev-parse HEAD)"
          printf '%s\n' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Configure strict environment-scoped SSH trust
        id: ssh
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash deploy/configure-deployment-ssh.sh

      - name: Deploy exact commit via strict SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY_PATH: ${{ steps.ssh.outputs.private_key }}
          DEPLOY_SSH_KNOWN_HOSTS_PATH: ${{ steps.ssh.outputs.known_hosts }}
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s\n' "$DEPLOY_VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          evidence_file="$RUNNER_TEMP/patt-development-deployment.txt"
          bash deploy/run-strict-ssh.sh \
            "set -eu; export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_TERMINAL_PROMPT=0; cd /opt/guild-portal; previous_sha=\$(if [ -s .deployment/active-sha ]; then cat .deployment/active-sha; else git rev-parse HEAD; fi); fetch_repository=\$(mktemp -d /tmp/patt-fetch.XXXXXX); trap 'rm -rf \$fetch_repository' EXIT; git -C \$fetch_repository init --bare; git -C \$fetch_repository fetch --no-tags '$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git' '$DEPLOY_SHA:refs/heads/patt-deploy'; git fetch --no-tags \$fetch_repository refs/heads/patt-deploy; rm -rf \$fetch_repository; trap - EXIT; git cat-file -e '$DEPLOY_SHA^{commit}'; git checkout --detach '$DEPLOY_SHA'; test \"\$(git rev-parse HEAD)\" = '$DEPLOY_SHA'; exec bash deploy/patt-remote-deploy.sh development '$DEPLOY_SHA' '$DEPLOY_VERSION' \"\$previous_sha\"" \
            | tee "$evidence_file"
          grep -Fqx \
            "PATT_DEPLOYMENT_COMPLETE environment=development version=$DEPLOY_VERSION commit=$DEPLOY_SHA" \
            "$evidence_file"
